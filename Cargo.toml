[package]
name = "nest"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "A browser-backed Ziroom search TUI"
license = "MIT"
repository = "https://github.com/Yanis897349/nest"
readme = "README.md"
keywords = ["cli", "tui", "rentals", "scraper"]
categories = ["command-line-utilities"]
publish = false

[dependencies]
anyhow = "1.0"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
chromiumoxide = "0.9.1"
clap = { version = "4.5", features = ["derive", "env"] }
csv = "1.3"
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
open = "5.3"
ratatui = "0.30.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.47", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
url = { version = "2.5", features = ["serde"] }

[dev-dependencies]
pretty_assertions = "1.4"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
panic = "abort"
